name: maui-artifacts

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore trampbazaar.csproj -p:TargetFramework=net9.0-windows10.0.19041.0

      - name: Publish Windows unpackaged app
        run: dotnet publish trampbazaar.csproj -f net9.0-windows10.0.19041.0 -c Release --no-restore -p:RuntimeIdentifier=win10-x64 -p:WindowsPackageType=None -o artifacts/windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: maui-windows-win10-x64
          path: artifacts/windows

  android:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore trampbazaar.csproj -p:TargetFramework=net9.0-android

      - name: Publish Android APK
        run: dotnet publish trampbazaar.csproj -f net9.0-android -c Release --no-restore -p:AndroidPackageFormat=apk -o artifacts/android

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: maui-android-apk
          path: artifacts/android

  ios-simulator:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore trampbazaar.csproj -p:TargetFramework=net9.0-ios

      - name: Publish iOS simulator app
        run: dotnet publish trampbazaar.csproj -f net9.0-ios -c Release --no-restore -p:RuntimeIdentifier=iossimulator-x64 -o artifacts/ios-simulator

      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: maui-ios-simulator
          path: artifacts/ios-simulator

  maccatalyst:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore trampbazaar.csproj -p:TargetFramework=net9.0-maccatalyst

      - name: Publish MacCatalyst app
        run: dotnet publish trampbazaar.csproj -f net9.0-maccatalyst -c Release --no-restore -p:RuntimeIdentifier=maccatalyst-x64 -o artifacts/maccatalyst

      - name: Upload MacCatalyst artifact
        uses: actions/upload-artifact@v4
        with:
          name: maui-maccatalyst
          path: artifacts/maccatalyst
