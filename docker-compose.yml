services:
  api:
    build:
      context: .
      dockerfile: trampbazaar.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SqlServer: ${TB_SQLSERVER_CONNECTION}
      Auth__SigningKey: ${TB_AUTH_SIGNING_KEY}
      Payments__Provider: ${TB_PAYMENTS_PROVIDER:-demo}
      Payments__DefaultSuccessUrl: ${TB_PAYMENTS_SUCCESS_URL:-http://localhost:8081/PaymentSuccess}
      Payments__DefaultCancelUrl: ${TB_PAYMENTS_CANCEL_URL:-http://localhost:8081/PaymentCancel}
      Payments__Stripe__SecretKey: ${TB_STRIPE_SECRET_KEY:-}
      Payments__Stripe__WebhookSecret: ${TB_STRIPE_WEBHOOK_SECRET:-}
      Cors__AllowedOrigins__0: ${TB_WEB_ORIGIN:-http://localhost:8081}
      Cors__AllowedOrigins__1: ${TB_ADMIN_ORIGIN:-http://localhost:8082}
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: trampbazaar.Web/Dockerfile
    depends_on:
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Api__BaseUrl: ${TB_INTERNAL_API_BASE_URL:-http://api:8080/}
    ports:
      - "8081:8080"

  admin:
    build:
      context: .
      dockerfile: trampbazaar.AdminWeb/Dockerfile
    depends_on:
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Api__BaseUrl: ${TB_INTERNAL_API_BASE_URL:-http://api:8080/}
    ports:
      - "8082:8080"
